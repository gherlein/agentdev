# omp provider: LiteLLM on dgx1 (OpenAI-compatible), serving glm-4.5-air from Ollama on dgx2.
# Only this one model is declared, and there is no discovery: LiteLLM also routes cloud models,
# and they must not be selectable from this profile.
providers:
  litellm:
    # Fully qualified: allowlist mode cannot resolve LAN short names.
    baseUrl: http://dgx1.herlein.me:4000/v1
    api: openai-completions
    # LiteLLM runs with no master key.
    auth: none
    compat:
      supportsDeveloperRole: false
      # LiteLLM rejects OpenAI's `store` param for Ollama-backed models.
      supportsStore: false
    models:
      - id: glm-4.5-air
        name: GLM-4.5-Air Q4 (dgx2 ollama via litellm)
        reasoning: false
        input: [text]
        # The window Ollama serves for this model (from /api/ps on dgx2).
        contextWindow: 131072
        maxTokens: 32000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
