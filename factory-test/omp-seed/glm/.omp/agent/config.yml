# Every role resolves to the local model, and the cloud providers are disabled, so nothing in
# this profile can reach a frontier model.
modelRoles:
  default: litellm/glm-4.5-air
  smol: litellm/glm-4.5-air
  commit: litellm/glm-4.5-air
  plan: litellm/glm-4.5-air
  slow: litellm/glm-4.5-air
retry:
  modelFallback: false
disabledProviders:
  - anthropic
  - openai
  - google
setupVersion: 2
