# omp provider: LiteLLM on dgx1 (OpenAI-compatible), serving qwen3-coder-next:q8_0 from Ollama on
# dgx1 under the alias local-qwen. Only this one model is declared, and there is no discovery:
# LiteLLM also routes cloud models, and they must not be selectable from this profile.
providers:
  litellm:
    # Fully qualified: allowlist mode cannot resolve LAN short names.
    baseUrl: http://dgx1.herlein.me:4000/v1
    api: openai-completions
    # LiteLLM runs with no master key.
    auth: none
    compat:
      supportsDeveloperRole: false
      # LiteLLM rejects OpenAI's `store` param for Ollama-backed models.
      supportsStore: false
    models:
      - id: local-qwen
        name: Qwen3-Coder-Next Q8 (dgx1 ollama via litellm)
        # qwen3-coder-next has no thinking mode.
        reasoning: false
        input: [text]
        # The window Ollama serves for this model (from /api/ps on dgx1).
        contextWindow: 262144
        maxTokens: 32000
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
